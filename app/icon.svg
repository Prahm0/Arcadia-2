<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    Canonical Arcadia mark. Exact same path and proportions as
    components/ui/Logo.tsx so the favicon, PWA icon, and every in-app
    reference render identically at any size. Dark rounded background
    matches the app-shell surface tone. The corner radius is large enough to
    read as rounded at 16px in a tab, and the mark is inset so its corners
    sit inside the rounded tile. favicon.ico is rendered from this file.
  -->
  <rect width="128" height="128" rx="30" fill="#0a0714" />
  <path
    fill="#7c5cff"
    fill-rule="evenodd"
    transform="translate(64 66) scale(0.72) translate(-64 -64)"
    d="M64 8 L124 120 L4 120 Z M64 44 L96 108 L32 108 Z M64 76 L78 98 L50 98 Z"
  />
</svg>
