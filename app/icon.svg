<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Rounded-square app icon. Gradient violet backing so the mark stays
    legible whether the notification tray is light or dark; the mark
    itself is a slightly cream-white so it doesn't glare on dark
    backgrounds and still reads on white.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9d87ff" />
      <stop offset="100%" stop-color="#5f42d6" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container: rounded square, ~17% corner radius (iOS-style). -->
  <rect width="512" height="512" rx="88" fill="url(#bg)" />
  <rect width="512" height="512" rx="88" fill="url(#glow)" />

  <!-- The four-point Arcadia mark, centred and scaled to fill ~55% of the icon. -->
  <g transform="translate(256 256)">
    <path
      d="
        M 0 -140
        C 0 -63, 63 0, 140 0
        C 63 0, 0 63, 0 140
        C 0 63, -63 0, -140 0
        C -63 0, 0 -63, 0 -140
        Z
      "
      fill="#fdf9ee"
    />
  </g>
</svg>
