<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Arcadia</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#04040e;color:#f7f5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100svh;padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));display:grid;place-items:center}.card{max-width:340px;text-align:center}.mark{width:72px;height:72px;border-radius:18px;margin:auto;background:#090812}.mark img{width:100%;height:100%;border-radius:18px}h1{font-size:28px;letter-spacing:-.03em;margin:24px 0 10px}p{font-size:16px;line-height:1.55;color:#bdb8cb;margin:0}button{margin-top:28px;border:0;border-radius:12px;background:#7657f6;color:#fff;font:600 16px inherit;padding:14px 22px}button:active{transform:scale(.98)}</style></head><body><main class="card"><div class="mark"><img src="arcadia-mark.png" alt="Arcadia"></div><h1>You&rsquo;re offline</h1><p>Arcadia needs a connection to load your plan. We&rsquo;ll reconnect as soon as you&rsquo;re back.</p><button id="retry" type="button">Try again</button></main><script>
const target='https://arcadiahq.app/app';let trying=false;async function retry(){if(trying||document.visibilityState!=='visible')return;trying=true;try{await fetch('https://arcadiahq.app/',{mode:'no-cors',cache:'no-store'});location.replace(target)}catch{}finally{trying=false}}document.getElementById('retry').onclick=retry;addEventListener('online',retry);setInterval(retry,5000);addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')retry()});
</script></body></html>
