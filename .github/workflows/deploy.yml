# Builds the Next.js app with OpenNext and deploys BOTH Workers to Cloudflare
# on every push to `main`. Frontend (arcadia-web) and backend (arcadia-api)
# get their own jobs so a change to only one still deploys only the one
# that changed, and a change to both fans out in parallel.
#
# Manual runs are supported via workflow_dispatch in the Actions tab (useful
# for retrying a flaky deploy without an empty commit).
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN       — token from Cloudflare with the
#                                "Edit Cloudflare Workers" template, scoped
#                                to the arcadia account + arcadiahq.app zone,
#                                plus D1 Edit for the migrations step.
#   NEXT_PUBLIC_SENTRY_DSN     — browser Sentry DSN (baked into the client
#                                bundle at build time).
#   SENTRY_DSN                 — server-side Sentry DSN (runtime var; also
#                                baked in for parity so instrumentation.ts
#                                sees it during SSR).
#   NEXT_PUBLIC_REVENUECAT_IOS_API_KEY and the six
#   NEXT_PUBLIC_REVENUECAT_IOS_{PRO,MAX}_{WEEKLY,MONTHLY,YEARLY} values
#                              — public iOS RevenueCat key and App Store product
#                                IDs, baked into the native-only billing UI.
#
# The Worker runtimes already have their own copies of runtime secrets set
# via `wrangler secret put`; those don't come from CI. This workflow only
# needs the DSNs at build time so the client bundle can embed the browser
# DSN.
#
# Database migrations (D1) are applied by the backend job, right before the
# Worker deploys, whenever anything under backend/ changes. To apply them by
# hand instead: cd backend && npm run db:migrate:remote

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A second push mid-deploy cancels the first — the newer push already
  # includes the older changes.
  group: deploy-main
  cancel-in-progress: true

jobs:
  # ────────────── What changed since the last good deploy ──────────────
  # Diffing only this push (github.event.before..sha) misses changes from a
  # push whose deploy was cancelled by a newer one above: if the cancelled
  # push touched backend/ and the newer one didn't, the backend (and its
  # migrations) would silently never deploy. So diff from the commit the last
  # SUCCESSFUL deploy shipped instead, falling back to event.before.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Full history so the base commit is reachable for `git diff`.
          fetch-depth: 0

      - name: Diff against the last successful deploy
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: deploying both."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' || true)
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit: deploying both."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Diffing $BASE..${{ github.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          if echo "$CHANGED" | grep -Ev '^backend/' | grep -q '.'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -q '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  # ────────────── Frontend Worker (arcadia-web) ──────────────
  frontend:
    name: Build & deploy arcadia-web
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js + OpenNext bundle
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
          SENTRY_ENVIRONMENT: production
          NEXT_PUBLIC_REVENUECAT_IOS_API_KEY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_IOS_API_KEY }}
          NEXT_PUBLIC_REVENUECAT_IOS_PRO_WEEKLY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_IOS_PRO_WEEKLY }}
          NEXT_PUBLIC_REVENUECAT_IOS_PRO_MONTHLY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_IOS_PRO_MONTHLY }}
          NEXT_PUBLIC_REVENUECAT_IOS_PRO_YEARLY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_IOS_PRO_YEARLY }}
          NEXT_PUBLIC_REVENUECAT_IOS_MAX_WEEKLY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_IOS_MAX_WEEKLY }}
          NEXT_PUBLIC_REVENUECAT_IOS_MAX_MONTHLY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_IOS_MAX_MONTHLY }}
          NEXT_PUBLIC_REVENUECAT_IOS_MAX_YEARLY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_IOS_MAX_YEARLY }}
          NODE_ENV: production
        run: npm run build

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

  # ────────────── Backend Worker (arcadia-api) ──────────────
  backend:
    name: Build & deploy arcadia-api
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Before the deploy, so new code never runs against an old schema. Only
      # pending migrations run (D1 tracks applied ones), so this is a no-op on
      # most pushes; if one fails, the job stops and the old Worker stays up.
      - name: Apply D1 migrations
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply arcadia --remote

      - name: Deploy Worker to Cloudflare
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
